[tool.ruff]
target-version = "py311"
line-length = 100
src = ["backend", "tests", "migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501", # line length is handled by the formatter
    "B008", # FastAPI idiom: Depends()/Query() in argument defaults
]

[tool.pytest.ini_options]
testpaths = ["tests"]
